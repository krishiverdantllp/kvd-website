name: Deploy Vite → GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: 18 }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4   # optional if you split jobs
        with:
          name: vite-dist
          path: dist

  deploy:
    needs: build      # or skip if single‐job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3       # if you’re doing it in one job, omit
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
